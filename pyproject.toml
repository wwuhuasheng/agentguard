[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yujie-agentguard"
version = "0.1.0"
description = "A deterministic trust boundary for tool-using agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.8", "httpx>=0.27"]

[tool.setuptools]
packages = [
  "backend",
  "backend.agent_core",
  "backend.api",
  "backend.mcp_gateway",
  "backend.mcp_service",
  "backend.mock_tools",
  "backend.models",
  "backend.policy_engine",
  "backend.recovery",
  "backend.services",
]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
